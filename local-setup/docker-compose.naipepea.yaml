# Image override — pin every service to what naipepea actually runs.
# Layered after docker-compose.local.yaml so these `image:` lines win.
#
# Source of truth: ssh naipepea "grep image: /opt/digit/docker-compose.egov-digit.yaml"
# Captured 2026-04-30. Regenerate via scripts/gen-naipepea-override.py if/when
# naipepea's compose drifts.
#
# Notes:
#   - All images are amd64-only. On Apple Silicon they run under Rosetta
#     emulation (slower JVM startup). Docker Desktop must have Rosetta enabled.
#   - Two naipepea services use locally-built images NOT in the registry:
#       egov-workflow-v2 → sla-reset    (kept on public egovio/* below)
#       digit-mcp        → :latest      (not in our compose stack at all)
#     For full parity, ssh naipepea + `docker save | docker load` those.

services:
  # ─── persistence ─────────────────────────────────────────────────────────
  postgres-db:
    image: ${REGISTRY_URL}/postgres:16
  pgbouncer:
    image: ${REGISTRY_URL}/edoburu/pgbouncer:latest
  redis:
    image: ${REGISTRY_URL}/redis:7.2.4
  redpanda:
    image: ${REGISTRY_URL}/redpandadata/redpanda:v24.1.1
  minio:
    image: ${REGISTRY_URL}/minio/minio:RELEASE.2024-01-16T16-07-38Z
  minio-init:
    image: ${REGISTRY_URL}/minio/mc:RELEASE.2024-01-16T16-06-34Z

  # ─── core eGov services ──────────────────────────────────────────────────
  kong:
    image: ${REGISTRY_URL}/kong:3.6
  mdms-backend:
    image: ${REGISTRY_URL}/egovio/mdms-v2:v2.9.2-4a60f20
  egov-mdms-service:
    image: ${REGISTRY_URL}/nginx:alpine
  egov-enc-service:
    image: ${REGISTRY_URL}/egovio/egov-enc-service:v2.9.2-4a60f20
  egov-idgen:
    image: ${REGISTRY_URL}/egovio/egov-idgen:v2.9.2-4a60f20
  egov-user:
    image: ${REGISTRY_URL}/egovio/egov-user:updatenovalidate-fix
  # egov-workflow-v2: naipepea uses egov-workflow-v2:sla-reset (locally-built).
  # Falling back to public until we save/load from naipepea.
  # egov-workflow-v2:
  #   image: ${REGISTRY_URL}/egovio/egov-workflow-v2:v2.9.2-4a60f20
  egov-localization:
    image: ${REGISTRY_URL}/egovio/egov-localization:jdk21-cds
  boundary-service:
    image: ${REGISTRY_URL}/egovio/boundary-service:v2.9.2-dual-mode
  egov-accesscontrol:
    image: ${REGISTRY_URL}/egovio/egov-accesscontrol:v2.9.2-4a60f20
  egov-persister:
    image: ${REGISTRY_URL}/egovio/egov-persister:v2.9.2-4a60f20
  egov-filestore:
    image: ${REGISTRY_URL}/egovio/egov-filestore:v2.9.2-4a60f20
  egov-hrms:
    image: ${REGISTRY_URL}/egovio/egov-hrms:default-pwd
  egov-bndry-mgmnt:
    image: ${REGISTRY_URL}/egovio/egov-bndry-mgmnt:bndry-mgmnt-3794b8c
  egov-url-shortening:
    image: ${REGISTRY_URL}/egovio/egov-url-shortening:v2.9.2-4a60f20

  # ─── PGR + frontends ─────────────────────────────────────────────────────
  pgr-services:
    # naipepea actually runs `inbox-filters` tag (sha 224773a276e5).
    # `:latest` in the registry has been overwritten with a newer build that
    # lacks the /v2/dashboard endpoint. Pin to inbox-filters for parity.
    image: ${REGISTRY_URL}/pgr-services-dev:inbox-filters
  digit-ui:
    image: ${REGISTRY_URL}/digit-ui:pgr-fixes

  # ─── auxiliaries ─────────────────────────────────────────────────────────
  pgr-workflow-seed:
    image: ${REGISTRY_URL}/curlimages/curl:latest
  gatus:
    image: ${REGISTRY_URL}/twinproduction/gatus:latest
