# nginx config mounted into the `configurator` docker service.
# Same shape as production naipepea: SPA at /configurator/, API paths
# proxied to Kong at the in-network alias `kong:8000`.

server {
    listen 80;
    underscores_in_headers on;

    # Configurator SPA — assets baked under /configurator/ prefix at build time
    location /configurator {
        root /var/www;
        index index.html;
        try_files $uri $uri/ /configurator/index.html;
    }

    # DIGIT API paths -> Kong. Match prefixes so SPA xhr calls round-trip
    # through the same origin (mirrors how the prod nginx vhost behaves).
    location ~ ^/(mdms-v2|egov-mdms-service|access|user|pgr-services|egov-hrms|filestore|localization|egov-workflow-v2|boundary-service|egov-idgen|encryption-service|tl-services|pdf-service|notifications|egov-url-shortening|egov-bndry-mgmnt|common-persist)(/|$) {
        proxy_pass http://kong:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    # Optional: redirect bare / to /configurator/
    location = / {
        return 302 /configurator/;
    }
}
