# Personal-install additions on top of the upstream-derived compose.
# Layered via `docker compose -f docker-compose.local.yaml -f docker-compose.extra.yaml`
# so the upstream stays gen-from-source and the extras live alongside.

services:
  configurator:
    image: ${REGISTRY_URL}/nginx:alpine
    container_name: configurator
    restart: unless-stopped
    ports:
      # PORT_PREFIX env var (from config.env) drives the host port. 172 matches
      # the legacy 16xxx port plan documented in Nai Pepea/INFRA-NOTES.md.
      - "${PORT_PREFIX:-16}172:80"
    volumes:
      # Configurator SPA built dist (run `npx vite build --base=/configurator/`
      # in egov/digit-configurator before `docker compose up`)
      - ../../digit-configurator/dist:/var/www/configurator:ro
      - ./configurator-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - egov-network
    depends_on:
      kong:
        condition: service_healthy
